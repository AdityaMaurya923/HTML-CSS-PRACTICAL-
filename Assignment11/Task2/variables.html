<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Variables</title>
  <style>
    :root {
      --main-color: #1d3557;
      --accent-color: #e63946;
      --page-padding: 20px;
    }
    body { color: var(--main-color); padding: var(--page-padding); font-family: Arial, sans-serif; }
    h1 { color: var(--accent-color); }
  </style>
</head>
<body>
  <h1>CSS Variables</h1>
  <p>This text uses the main colour from a variable.</p>
</body>
</html>
