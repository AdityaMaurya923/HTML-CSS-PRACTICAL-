<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inline and Internal CSS</title>
  <style>
    h1 { color: navy; }
    .highlight { background-color: yellow; }
  </style>
</head>
<body>
  <h1>CSS in Two Ways</h1>
  <p style="color: red;">This paragraph is red using an inline style.</p>
  <p class="highlight">This paragraph has a yellow background from the internal style.</p>
</body>
</html>
